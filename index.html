<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 3: Quiz</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="scripts/script.js" defer></script>
</head>

<body>

    <h1>HTML and CSS Quiz</h1>

    <div id="q1Choices">
        <h3 id="q1Question">1. What HTML element creates a dropdown menu?</h3>
        <br>
    </div>
    <span id="q1Feedback"></span>

    <div id="q2Choices">
        <h3 id="q2Question">2. Who is the creator of Beat It?</h3>
        <br>
        <input type="text" id="q2">
    </div>
    <span id="q2Feedback"></span>

    <div id="q3Choices">
        <h3 id="q3Question">3. What year was the Toyota Camry Debuted In?</h3>
        <br>
        <select id="q3">
            <option value="1973">1973</option>
            <option value="1982">1982</option>
            <option value="1991">1991</option>
        </select>
    </div>
    <span id="q3Feedback"></span>

    <div id="q4Choices">
        <h3 id="q4Question">4. What's 2 + 4?</h3>
        <br>
        <input id="q4" type="number">
    </div>
    <span id="q4Feedback"></span>

    <div id="q5Choices">
        <h3 id="q5Question">5. Which of the following are semantic HTML elements?</h3>
        <label>
            <input type="checkbox" id="q5Header" name="q5" value="header">&lt;header&gt;
        </label>
        <label>
            <input type="checkbox" id="q5Nav" name="q5" value="nav">&lt;nav&gt;
        </label>
        <label>
            <input type="checkbox" id="q5Main" name="q5" value="main">&lt;main&gt;
        </label>
        <label>
            <input type="checkbox" id="q5Div" name="q5" value="div">&lt;div&gt;
        </label>
    </div>
    <span id="q5Feedback"></span>

    <br>
    <button id="submitButton" type="button">Submit Quiz</button>

    <p id="quizScores">Submit Quiz Score: 0</p>
    <p>Total times quiz taken: <span id="attemptCount">0</span></p>
    <p id="congratsMessage"></p>
</body>

</html>
